<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonal Sai - Full Stack &amp; Frontend Developer</title>
    <!--
      SPA fallback for GitHub Pages. The app uses BrowserRouter (clean URLs),
      but GitHub Pages serves this 404.html for any unknown path. This script
      encodes the requested path into a query string and redirects to "/",
      where index.html decodes it back and hands it to the router.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0; // custom domain (www.sonalsai.site) => keep 0
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
